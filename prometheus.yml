global:
  scrape_interval: 15s
  evaluation_interval: 15s

rule_files:
  # - "first_rules.yml"
  # - "second_rules.yml"

scrape_configs:
  # Flowin Admin Panel
  - job_name: 'flowin-admin'
    static_configs:
      - targets: ['flowin-admin:3000']
    metrics_path: '/api/metrics'
    scrape_interval: 30s

  # Flowin Backend API
  - job_name: 'flowin-backend'
    static_configs:
      - targets: ['flowin-backend:3001']
    metrics_path: '/api/metrics'
    scrape_interval: 30s

  # SCADA Service
  - job_name: 'scada-service'
    static_configs:
      - targets: ['scada-service:3002']
    metrics_path: '/metrics'
    scrape_interval: 15s

  # PostgreSQL Database
  - job_name: 'postgres'
    static_configs:
      - targets: ['postgres:5432']
    scrape_interval: 30s

  # Redis Cache
  - job_name: 'redis'
    static_configs:
      - targets: ['redis:6379']
    scrape_interval: 30s

  # Nginx
  - job_name: 'nginx'
    static_configs:
      - targets: ['nginx:80']
    scrape_interval: 30s

  # Node Exporter (if available)
  - job_name: 'node-exporter'
    static_configs:
      - targets: ['node-exporter:9100']
    scrape_interval: 30s

  # Prometheus itself
  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']
